name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Dependências com vulnerabilidades conhecidas (moderadas ou superiores) falham a integração.
      - run: npm audit --audit-level=moderate
      # `dist/` é versionado para a instalação directa a partir do Git: tem de reflectir `src/`.
      - name: Confirmar que dist/ está sincronizado com src/
        run: git diff --exit-code -- dist
      # Instala o tarball a sério: `npm pack --dry-run` não deteta módulos
      # ausentes do campo `files` nem artefactos obsoletos em dist/.
      - run: npm run smoke
