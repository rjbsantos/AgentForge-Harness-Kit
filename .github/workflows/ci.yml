name: CI
# Local primeiro: `npm run ci` repete estes passos na máquina de quem altera (e o hook `pre-push`
# fá-lo antes de cada envio). Aqui corre só na confirmação final, num pull request, ou à mão.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      # Dependências com vulnerabilidades conhecidas (moderadas ou superiores) falham a integração.
      - run: npm audit --audit-level=moderate
      # `dist/` é versionado para a instalação directa a partir do Git: tem de reflectir `src/`.
      - name: Confirmar que dist/ está sincronizado com src/
        run: git diff --exit-code -- dist
      # Instala o tarball a sério: `npm pack --dry-run` não deteta módulos
      # ausentes do campo `files` nem artefactos obsoletos em dist/.
      - run: npm run smoke
