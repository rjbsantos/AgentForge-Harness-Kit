name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      # A tag tem de corresponder à versão do package.json; sem isto publica-se
      # um tarball com versão diferente daquela que a tag anuncia.
      - name: Confirmar que a tag corresponde à versão
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version" || { echo "tag $tag != versão $version"; exit 1; }
      - run: mkdir -p dist-release && npm pack --pack-destination dist-release
      - name: Resumo SHA-256 do tarball
        run: cd dist-release && sha256sum *.tgz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist-release/*.tgz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist-release/*.tgz
            dist-release/SHA256SUMS
          generate_release_notes: true
